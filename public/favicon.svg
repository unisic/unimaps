<svg width="128" height="128" viewBox="8 8 112 112" xmlns="http://www.w3.org/2000/svg">
  <!-- Unimaps, in the Unisic family: the same tile, the same palette, but what it
       holds is a map with a route ending at a pin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#433D8B"/>
      <stop offset="1" stop-color="#2E236C"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E236C"/>
      <stop offset="1" stop-color="#17153B"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="30" fill="none" stroke="#C8ACD6" stroke-opacity="0.28" stroke-width="2"/>
  <!-- top sheen -->
  <path d="M 38 8 h 52 a 30 30 0 0 1 30 30 v 8 H 8 v -8 a 30 30 0 0 1 30 -30 z" fill="#FFFFFF" opacity="0.06"/>

  <g id="glyph">
    <!-- the map: where Tuni puts a window, Unimaps puts a street grid -->
    <rect x="24" y="24" width="80" height="80" rx="18" fill="url(#screen)"/>
    <path d="M24 46 H104 M24 76 H104 M48 24 V104" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="5"/>
    <!-- the route: one line, two stops behind, the pin where the bus is going -->
    <path d="M36 54 C36 76 44 90 64 90 H72" fill="none" stroke="#C8ACD6" stroke-width="7" stroke-linecap="round"/>
    <circle cx="36" cy="52" r="7" fill="#17153B" stroke="#C8ACD6" stroke-width="4"/>
    <path d="M76 90 C76 90 56 70 56 54 A20 20 0 0 1 96 54 C96 70 76 90 76 90 Z" fill="#F5EFF9"/>
    <circle cx="76" cy="54" r="8" fill="#433D8B"/>
  </g>
</svg>
