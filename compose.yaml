services:
  kb-gtfs:
    build: .
    container_name: kb-gtfs
    ports:
      # host port is env-driven so this host maps 6060; repo default stays 8080
      - "${KB_HOST_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # ports + healthchecks assume 8080; don't let a PORT in .env move the listener
      PORT: "8080"
    restart: unless-stopped
    # blast radius if a framework RCE ever lands: image code is immutable, no capabilities,
    # no setuid escalation, no fork bomb. Every write the app makes goes to /app/output
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    volumes:
      # built GTFS feed (stop-direction arrows, line catalog) + logs — survives
      # redeploys; populated by the in-process nightly build (KB_GTFS_AUTOBUILD)
      - kb-output:/app/output
    # Marks the container (unhealthy) on a stalled scan loop or stale upstream;
    # Docker itself never restarts on that (restart only acts on process exit).
    # Watch it from outside, e.g. an uptime monitor on /api/health.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  kb-output:
