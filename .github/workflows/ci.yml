name: CI

on:
  push:
    branches: [main]
  pull_request:
  # a new advisory against an unchanged lockfile turns the audit red (and mails the repo owner)
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm audit --omit=dev --audit-level=high

  # The production deploy path (Dockerfile COPY stages, .dockerignore). Build
  # only: running the image would start the poller against the live upstream.
  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t kb-gtfs:ci .
