version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Next patches land as next + eslint-config-next together; React moves with them
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
