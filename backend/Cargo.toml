[package]
name = "unimaps"
version = "0.1.0"
edition = "2024"
# let chains in `if let ... && let`
rust-version = "1.88"

[dependencies]
bytes = "1.12.1"
dotenvy = "0.15.7"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
icu_collator = "2.4.0"
icu_locale_core = { version = "2.4.0", default-features = false }
icu_normalizer = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
indexmap = { version = "2.14.2", features = ["serde"] }
jiff = { version = "0.2.39", features = ["tzdb-bundle-always"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha1 = "0.10.6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "io-util"] }

[profile.release]
strip = true

[lints.clippy]
# a route helper's Err is the Response the route returns right away; boxing it only adds an allocation
result_large_err = "allow"
