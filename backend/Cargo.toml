[package]
name = "unimaps"
version = "0.1.0"
edition = "2024"
# let chains in `if let ... && let`
rust-version = "1.88"

[dependencies]
bytes = "1.12.1"
dotenvy = "0.15.7"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "client-legacy", "http1"] }
jiff = "0.2.39"
libc = "0.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "io-util"] }

[profile.release]
strip = true
